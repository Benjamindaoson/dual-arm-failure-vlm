[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-chart-gspo"
version = "0.1.0"
description = "Qwen3-VL chart reasoning GSPO post-training evaluation"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "upgraded_implementation/src"}

[tool.setuptools.packages.find]
where = ["upgraded_implementation/src"]
