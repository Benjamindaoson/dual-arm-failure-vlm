[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reboot-recovery-vlm"
version = "0.1.0"
description = "Auditable multimodal post-training experiments on REBOOT precision-assembly failure and recovery traces"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
